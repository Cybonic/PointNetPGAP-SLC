device: cuda
experim_name: hortov2
loss:
  args:
    margin: 0.5
    metric: L2
    reduction: mean
  type: TripletLoss
n_gpu: 1
network:
  architecture: overlap_transformer
  checkpoints: checkpoints/hortov2/overlap_transformer-LazyTripletLoss_L2/best_model.pth
  input:
    num_points: 10000
    roi: 10
  output_dim: 256
  wrapper:
    mini_batch: 10
optimizer:
  args:
    lr: 0.0001
    weight_decay: 5.0e-08
  lr_scheduler: ReduceLROnPlateau
  type: AdamW
retrieval:
  range_thres: 6
  roi_window: 100
  sim_metric: L2
  top_cand:
  - 1
  - 5
  - 25
  warmup_window: 50
run:
  early_stop: 1000
  epochs: 100
  eval_protocol: val_only
  iter_per_epoch: 1
  log_dir: logs
  monitor: max recall
  range_report: 10
  report_val: 1
  save_deptrs: true
  save_dir: saved
  save_period: 1
  task: place
  val_per_epochs: 1
train_loader:
  augmentation: false
  batch_size: 1
  fraction: 0.3
  memory: DISK
  num_neg: 20
  num_pos: 1
  shuffle: true
  triplet_file: triplet/ground_truth_ar0.5m_nr10m_pr2m.pkl
val_loader:
  batch_size: 10
  dataset:
    path: dataset/PlaceRecognitionTestPolyTunnel
    seq:
    - PCD_MED
  loop_range: 10
  memory: DISK
  workers: 0
